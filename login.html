<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ENTRE — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Manrope:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.6"></script>
</head>
<body>
  <video id="bg-video" autoplay muted loop playsinline poster="assets/vid-01.jpg">
    <source src="assets/vid-01.mp4" type="video/mp4">
  </video>
  <div class="grain"></div>
  <header class="topbar">
    <a class="brand" href="index.html"><span>ENTRE</span><small>acervo de artes · IFPR</small></a>
    <nav>
      <a href="index.html#explorar">Explorar</a>
      <a href="index.html#artistas">Artistas</a>
      <a href="index.html#colecoes">Galeria</a>
      <a href="index.html#inspiracao">Inspiração</a>
      <a href="docs.html">Acervo Bibliográfico</a>
    </nav>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Entrar</button>
        <button class="auth-tab" data-tab="register">Criar conta</button>
      </div>

      <form id="login-form" class="auth-form">
        <label>
          <span>Email</span>
          <input type="email" id="login-email" required placeholder="seu@email.com">
        </label>
        <label>
          <span>Senha</span>
          <input type="password" id="login-password" required placeholder="••••••••">
        </label>
        <button type="submit" class="btn btn-dark">Entrar <span>↗</span></button>
        <p id="login-error" class="auth-error"></p>
      </form>

      <form id="register-form" class="auth-form" style="display:none;">
        <label>
          <span>Nome completo</span>
          <input type="text" id="reg-name" required placeholder="Seu nome">
        </label>
        <label>
          <span>Email</span>
          <input type="email" id="reg-email" required placeholder="seu@email.com">
        </label>
        <label>
          <span>Senha</span>
          <input type="password" id="reg-password" required placeholder="••••••••" minlength="6">
        </label>
        <label>
          <span>Tipo</span>
          <select id="reg-type">
            <option value="student">Aluno</option>
            <option value="advisor">Orientador</option>
          </select>
        </label>
        <button type="submit" class="btn btn-dark">Criar conta <span>↗</span></button>
        <p id="register-error" class="auth-error"></p>
      </form>
    </div>
  </main>

  <script src="assets/supabase.js"></script>
  <script src="assets/auth.js"></script>
</body>
</html>
